<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萬王之王 MUD - 線上泥巴遊戲</title>
<style>
  :root {
    --bg: #06080f;
    --panel: #0d1117;
    --panel-2: #161b22;
    --border: #2b3140;
    --text: #d6dde8;
    --muted: #6e7681;
    --gold: #e6b93f;
    --gold-dim: #5a4a1c;
    --accent: #e6b93f;
    --command: #7fb4ff;
    --error: #ff7b72;
    --room: #ffd866;
    --hp: #ff5f5f;
    --hp-bg: #2d1b1b;
    --tile: 76px;
    --gap: 10px;
    --map-size: calc(var(--tile) * 8 + var(--gap) * 7);
    /* 生物群系色 */
    --c-hub: #6b4f2a;
    --c-hub-edge: #e6b93f;
    --c-forest: #234d33;
    --c-cave: #3a3550;
    --c-river: #24455f;
    --c-castle: #4a4560;
    --c-treasure: #5a3d1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #141a2b 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "main sidebar"
      "input input";
    height: 100vh;
    overflow: hidden;
  }
  @media (max-width: 760px) {
    body {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main" "input";
    }
    #sidebar { display: none; }
  }
  #header {
    grid-area: header;
    background: linear-gradient(180deg, #1a1f2e, #0d1117);
    padding: 10px 16px;
    border-bottom: 2px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #header .brand { display: flex; align-items: center; gap: 10px; }
  #header .logo {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #f6d76b, #a5811f);
    border-radius: 8px;
    font-weight: bold;
    color: #2a1e04;
    font-size: 18px;
    box-shadow: 0 0 10px rgba(230,185,63,.4);
  }
  #header h1 {
    font-size: 18px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 #000;
  }
  #header .sub { font-size: 11px; color: var(--muted); }
  #status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  #status.connected { color: var(--gold); }
  #status.connected .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  #status.disconnected { color: var(--error); }
  #status.disconnected .dot { background: var(--error); }

  #main {
    grid-area: main;
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 10px;
    padding: 12px;
    min-height: 0;
  }
  @media (max-width: 900px) {
    #main { grid-template-columns: 1fr; grid-auto-rows: minmax(180px, auto); overflow-y: auto; }
    #map-panel { order: 2; }
  }

  /* ---- 磁貼地圖 ---- */
  #map-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  #map-panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted);
  }
  #map-frame {
    flex: 1;
    display: grid;
    place-items: center;
    min-height: 0;
    border-radius: 10px;
    background:
      radial-gradient(circle at center, rgba(230,185,63,.08) 0%, transparent 58%),
      #0a0d15;
    overflow: hidden;
  }
  #map {
    position: relative;
    width: var(--map-size);
    height: var(--map-size);
    transform-origin: center center;
    transition: transform .35s ease;
  }
  #connections {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  #connections line {
    stroke: rgba(230,185,63,.32);
    stroke-width: 3;
    stroke-dasharray: 5 7;
  }
  #connections line.active {
    stroke: rgba(230,185,63,.86);
    stroke-dasharray: none;
    filter: drop-shadow(0 0 5px rgba(230,185,63,.8));
  }
  .tile {
    position: absolute;
    width: var(--tile);
    height: var(--tile);
    border-radius: 9px;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 4px;
    font-size: 11px;
    color: #fff;
    background: #151a25;
    border: 2px solid #252c3d;
    transition: box-shadow .3s, border-color .3s, background .3s;
    line-height: 1.2;
    overflow: hidden;
    z-index: 2;
  }
  .tile .emoji { font-size: 22px; display: block; margin-bottom: 2px; }
  .tile.unexplored {
    background: #0d1119;
    border-color: #1d2333;
    color: #596174;
    opacity: .7;
  }
  .tile.unexplored .emoji { opacity: .38; }
  .tile.reachable {
    border-color: rgba(230,185,63,.58);
    box-shadow: 0 0 10px rgba(230,185,63,.26);
  }
  .tile.current {
    border-color: var(--gold);
    box-shadow: 0 0 18px 4px rgba(230,185,63,.62);
    z-index: 4;
  }
  .tile.current .you {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(230,185,63,.2);
    z-index: 5;
  }
  .tile.current .you span {
    font-size: 26px;
    filter: drop-shadow(0 0 4px #fff);
  }
  .tile.hub      { background: linear-gradient(160deg,#7a5a30,#3a2c17); border-color: #8a6a34; }
  .tile.forest   { background: linear-gradient(160deg,#2f6b44,#15301f); }
  .tile.cave     { background: linear-gradient(160deg,#4a4470,#241f38); }
  .tile.river    { background: linear-gradient(160deg,#2f6b9a,#16324a); }
  .tile.castle   { background: linear-gradient(160deg,#5f5a7e,#2b2840); }
  .tile.treasure { background: linear-gradient(160deg,#8a5f24,#3a2a10); border-color: #a5811f; }
  .tile .compass {
    position: absolute;
    top: 4px;
    right: 5px;
    font-size: 9px;
    color: rgba(255,255,255,.72);
    z-index: 6;
  }

  #legend { display: flex; flex-wrap: wrap; gap: 6px; }
  #legend .chip {
    font-size: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 7px;
    border-radius: 6px;
  }

  /* ---- 訊息日誌 ---- */
  #log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    overflow-y: auto;
    line-height: 1.7;
  }
  #log h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  #log .line { white-space: pre-wrap; word-break: break-word; }
  #log .line.command { color: var(--command); }
  #log .line.error { color: var(--error); }
  #log .line.system { color: var(--muted); font-style: italic; }
  #log .line.room { color: var(--room); font-weight: 600; }
  #log .line.npc { color: #ff9d76; }

  /* ---- 側欄 ---- */
  #sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    min-height: 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
  .stat-row .label { color: var(--muted); }
  .stat-row .value { color: var(--text); font-weight: 600; text-align: right; max-width: 60%; word-break: break-all; }
  .hp-bar {
    height: 8px;
    background: var(--hp-bg);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .hp-bar .fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff5f5f, #ff8c3a);
    transition: width .3s;
  }
  .quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .quick button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .quick button:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
    transform: translateY(-1px);
  }

  /* ---- 輸入區 ---- */
  #input-area {
    grid-area: input;
    padding: 10px 12px;
    border-top: 2px solid var(--gold-dim);
    background: linear-gradient(0deg, #0d1117, #151a26);
    display: flex;
    gap: 10px;
  }
  #prompt {
    color: var(--gold);
    font-weight: bold;
    line-height: 40px;
  }
  #input {
    flex: 1;
    background: #0a0e18;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 14px;
    height: 40px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  #input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px rgba(230,185,63,.15); }
</style>
</head>
<body>

<header id="header">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <h1>萬王之王 MUD</h1>
      <div class="sub">King of Kings · 線上泥巴冒險</div>
    </div>
  </div>
  <div id="status" class="disconnected">
    <span class="dot"></span>
    <span id="status-text">連線中…</span>
  </div>
</header>

<main id="main">
  <section id="map-panel">
    <h2>亞特蘭狄斯王國地圖</h2>
    <div id="map-frame">
      <div id="map">
        <svg id="connections"></svg>
      </div>
    </div>
    <div id="legend">
      <span class="chip">🏛️ 冒險者中心</span>
      <span class="chip">🌲 密語森林</span>
      <span class="chip">🕳️ 幽暗洞窟</span>
      <span class="chip">🌊 銀河河畔</span>
      <span class="chip">🏰 王城大門</span>
      <span class="chip">👑 王城大廳</span>
      <span class="chip">🐉 巨龍寶藏</span>
    </div>
  </section>

  <section id="log">
    <h2>冒險日誌</h2>
  </section>
</main>

<aside id="sidebar">
  <div class="card">
    <h3>角色狀態</h3>
    <div class="stat-row"><span class="label">名字</span><span class="value" id="stat-name">—</span></div>
    <div class="stat-row"><span class="label">位置</span><span class="value" id="stat-room">冒險者中心</span></div>
    <div class="hp-bar"><div class="fill" id="hpfill" style="width:100%"></div></div>
    <div class="stat-row"><span class="label">生命</span><span class="value" id="stat-hp">10 / 10</span></div>
    <div class="stat-row"><span class="label">攻擊</span><span class="value" id="stat-atk">5</span></div>
    <div class="stat-row"><span class="label">防禦</span><span class="value" id="stat-def">0</span></div>
  </div>
  <div class="card">
    <h3>快速指令</h3>
    <div class="quick">
      <button data-cmd="status">狀態</button>
      <button data-cmd="look">環顧</button>
      <button data-cmd="recall">召回</button>
      <button data-cmd="inventory">揹包</button>
      <button data-cmd="say hello">喊話</button>
      <button data-cmd="help">說明</button>
      <button data-cmd="north">北</button>
      <button data-cmd="south">南</button>
      <button data-cmd="east">東</button>
      <button data-cmd="west">西</button>
      <button data-cmd="hit 哥布林">戰鬥</button>
    </div>
  </div>
</aside>

<footer id="input-area">
  <span id="prompt">❯</span>
  <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="輸入指令，例如：help、北、召回、hit 巨龍…">
</footer>

<script>
const TILE = 76;
const GAP = 10;

const ROOMS = {
  hub:          { name: '冒險者中心', emoji: '🏛️', biome: 'hub',      x: 4, y: 4 },
  forest:       { name: '密語森林',   emoji: '🌲', biome: 'forest',   x: 4, y: 3 },
  cave:         { name: '幽暗洞窟',   emoji: '🕳️', biome: 'cave',     x: 3, y: 4 },
  river:        { name: '銀河河畔',   emoji: '🌊', biome: 'river',    x: 4, y: 5 },
  castle_gate:  { name: '王城大門',   emoji: '🏰', biome: 'castle',   x: 5, y: 4 },
  castle_hall:  { name: '王城大廳',   emoji: '👑', biome: 'castle',   x: 5, y: 3 },
  treasure:     { name: '巨龍寶藏',   emoji: '🐉', biome: 'treasure', x: 5, y: 2 },
};

const ROOM_BY_NAME = {};
Object.entries(ROOMS).forEach(([k, v]) => { ROOM_BY_NAME[v.name] = k; });

// 相鄰關係（雙向補全），對應 mud.js 的 exits。
const LINKS = [
  ['hub', 'forest'],
  ['hub', 'castle_gate'],
  ['hub', 'river'],
  ['hub', 'cave'],
  ['forest', 'cave'],
  ['forest', 'river'],
  ['forest', 'castle_gate'],
  ['castle_gate', 'castle_hall'],
  ['castle_hall', 'treasure'],
];

let currentRoom = 'hub';
const explored = new Set(['hub']);

function getPlayerId() {
  const q = new URLSearchParams(location.search).get('pid');
  if (q) return q;
  let id = localStorage.getItem('mud_player_id');
  if (!id) {
    id = 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    localStorage.setItem('mud_player_id', id);
  }
  return id;
}

function getPlayerName() {
  const q = new URLSearchParams(location.search).get('name');
  if (q) return q;
  let n = localStorage.getItem('mud_player_name');
  if (!n) {
    n = 'Player_' + Math.random().toString(36).slice(2, 6);
    localStorage.setItem('mud_player_name', n);
  }
  return n;
}

function printLine(text, cls) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setStatus(state, text) {
  const el = document.getElementById('status');
  el.className = state;
  const statusText = document.getElementById('status-text');
  statusText.textContent = text;
}
function setStat(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

const mapEl = document.getElementById('map');
const svgEl = document.getElementById('connections');

function tileLeft(key) { return ROOMS[key].x * (TILE + GAP); }
function tileTop(key) { return ROOMS[key].y * (TILE + GAP); }

function buildTiles() {
  mapEl.querySelectorAll('.tile, line').forEach(n => n.remove());
  for (let gx = 0; gx < 8; gx++) {
    for (let gy = 0; gy < 8; gy++) {
      const t = document.createElement('div');
      t.className = 'tile unexplored';
      t.style.left = (gx * (TILE + GAP)) + 'px';
      t.style.top = (gy * (TILE + GAP)) + 'px';
      t.dataset.grid = gx + ',' + gy;
      t.innerHTML = '<div class="emoji">？</div>未探索';
      mapEl.appendChild(t);
    }
  }

  Object.entries(ROOMS).forEach(([key, r]) => {
    const occupied = Array.from(mapEl.querySelectorAll('.tile'))
      .find(t => t.dataset.grid === r.x + ',' + r.y);
    if (!occupied) return;
    occupied.classList.remove('unexplored');
    occupied.classList.add(r.biome);
    occupied.dataset.room = key;
    occupied.innerHTML = `<div class="emoji">${r.emoji}</div>${r.name}`;
  });

  LINKS.forEach(([a, b]) => {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', tileLeft(a) + TILE / 2);
    line.setAttribute('y1', tileTop(a) + TILE / 2);
    line.setAttribute('x2', tileLeft(b) + TILE / 2);
    line.setAttribute('y2', tileTop(b) + TILE / 2);
    line.dataset.link = a + '|' + b;
    svgEl.appendChild(line);
  });

  fitMap();
  window.addEventListener('resize', fitMap);
}

function fitMap() {
  const frame = document.getElementById('map-frame');
  if (!frame) return;
  const scale = Math.min(frame.clientWidth, frame.clientHeight) / (TILE * 8 + GAP * 7 + 12);
  mapEl.style.transform = 'scale(' + Math.min(1, Math.max(.45, scale)) + ')';
}

function getNeighbors(roomKey) {
  const linked = [];
  LINKS.forEach(([a, b]) => {
    if (a === roomKey) linked.push(b);
    if (b === roomKey) linked.push(a);
  });
  return linked;
}

function updateMap(roomKey) {
  currentRoom = roomKey;
  if (ROOMS[roomKey]) explored.add(roomKey);
  const room = ROOMS[roomKey];
  const compassText = room ? getCompassFor(roomKey) : '';

  mapEl.querySelectorAll('.tile').forEach(t => {
    const key = t.dataset.room;
    const isCurrent = key === roomKey;
    const isKnown = key && explored.has(key);
    t.classList.toggle('current', isCurrent);
    t.classList.toggle('unexplored', !isKnown);
    t.classList.remove('reachable');

    const compass = t.querySelector('.compass');
    if (compass) compass.remove();
    if (isKnown || isCurrent) {
      const c = document.createElement('div');
      c.className = 'compass';
      c.textContent = compassText[key] || '';
      t.appendChild(c);
    }

    const you = t.querySelector('.you');
    if (isCurrent) {
      if (!you) {
        const y = document.createElement('div');
        y.className = 'you';
        y.innerHTML = '<span>🧝</span>';
        t.appendChild(y);
      }
    } else if (you) {
      you.remove();
    }

    if (isKnown) {
      const biomeTile = key ? document.querySelector(`.tile[data-room="${key}"]`) : null;
      if (biomeTile) biomeTile.classList.toggle('reachable',
        getNeighbors(roomKey).includes(key) && key !== roomKey
      );
    }
  });

  svgEl.querySelectorAll('line').forEach(line => {
    const [a, b] = line.dataset.link.split('|');
    line.classList.toggle('active', a === roomKey || b === roomKey);
  });
}

function getCompassFor(roomKey) {
  const r = ROOMS[roomKey];
  if (!r) return {};
  const compass = {};
  const neighbors = getNeighbors(roomKey);
  if (neighbors.includes('forest')) compass.forest = '南';
  if (neighbors.includes('cave')) compass.cave = '西';
  if (neighbors.includes('river')) compass.river = '東';
  if (neighbors.includes('castle_gate')) compass.castle_gate = '北';
  if (neighbors.includes('castle_hall')) compass.castle_gate = '南';
  if (neighbors.includes('treasure')) compass.castle_hall = '南';
  if (neighbors.includes('castle_hall')) compass.treasure = '北';
  return compass;
}

function roomKeyFromName(name) {
  if (!name) return null;
  if (ROOM_BY_NAME[name]) return ROOM_BY_NAME[name];
  if (ROOMS[name]) return name;
  return null;
}

buildTiles();
updateMap('hub');

const playerId = getPlayerId();
const playerName = getPlayerName();
setStat('stat-name', playerName);

const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = protocol + '//' + window.location.host + '/ws?player=' + playerId + '&name=' + encodeURIComponent(playerName);

let ws = null;
let reconnectAttempts = 0;
const history = [];
let historyIndex = 0;

const input = document.getElementById('input');

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    setStatus('connected', '已連線為 ' + playerName);
    reconnectAttempts = 0;
    printLine('=== 歡迎來到萬王之王 MUD ===', 'system');
    printLine('你已身在冒險者中心。輸入 "help" 開始冒險。', 'system');
    input.focus();
  };

  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { printLine(event.data, ''); return; }
    if (data.text) {
      const lines = data.text.split('\n');
      lines.forEach(line => {
        let cls = '';
        const l = line;
        const hpMatch = l.match(/生命：\s*(\d+)\s*\/\s*(\d+)/);
        const atkMatch = l.match(/攻擊：\s*(\d+)/);
        const defMatch = l.match(/防禦：\s*(\d+)/);
        if (hpMatch) {
          const cur = parseInt(hpMatch[1], 10), max = parseInt(hpMatch[2], 10);
          setStat('stat-hp', cur + ' / ' + max);
          document.getElementById('hpfill').style.width =
            Math.max(0, Math.min(100, max ? (cur / max) * 100 : 0)) + '%';
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (atkMatch || defMatch) {
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (l.startsWith('你身在：')) {
          const roomName = l.replace(/^你身在：\s*/, '').trim();
          setStat('stat-room', roomName);
          updateMap(roomKeyFromName(roomName) || 'hub');
          cls = 'room';
        } else if (l.startsWith('位置：')) {
          const roomName = l.replace(/^位置：\s*/, '').trim();
          setStat('stat-room', roomName);
          updateMap(roomKeyFromName(roomName) || 'hub');
          cls = 'system';
        } else if (l.startsWith('未知指令')) {
          cls = 'error';
        } else if (/(哥布林|薩滿|渡鴉|衛兵|巨龍)/.test(l) &&
                   (l.includes('造成') || l.includes('生命') || l.includes('打倒') || l.includes('反擊'))) {
          cls = 'npc';
        }
        printLine(l, cls);
      });
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', '已斷線');
    if (reconnectAttempts < 5) {
      reconnectAttempts++;
      printLine('連線中斷，重連中…（第 ' + reconnectAttempts + ' 次）', 'error');
      setTimeout(connect, 2000 * reconnectAttempts);
    }
  };
  ws.onerror = () => setStatus('disconnected', '連線錯誤');
}

function sendCommand(cmd) {
  const text = cmd.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  printLine('> ' + text, 'command');
  ws.send(text);
  history.push(text);
  historyIndex = history.length;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendCommand(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (history.length && historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (history.length && historyIndex < history.length) {
      historyIndex++;
      input.value = history[historyIndex] || '';
    }
  }
});

document.querySelectorAll('.quick button').forEach(btn => {
  btn.addEventListener('click', () => {
    sendCommand(btn.dataset.cmd);
    input.focus();
  });
});

connect();
</script>
</body>
</html>
