<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萬王之王 MUD - 線上泥巴遊戲</title>
<style>
  :root {
    --bg: #06080f;
    --panel: #0d1117;
    --panel-2: #161b22;
    --border: #2b3140;
    --text: #d6dde8;
    --muted: #6e7681;
    --gold: #e6b93f;
    --gold-dim: #5a4a1c;
    --accent: #e6b93f;
    --command: #7fb4ff;
    --error: #ff7b72;
    --room: #ffd866;
    --hp: #ff5f5f;
    --hp-bg: #2d1b1b;
    /* 生物群系色 */
    --c-hub: #6b4f2a;
    --c-hub-edge: #e6b93f;
    --c-forest: #234d33;
    --c-cave: #3a3550;
    --c-river: #24455f;
    --c-castle: #4a4560;
    --c-treasure: #5a3d1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #141a2b 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "main sidebar"
      "input input";
    height: 100vh;
    overflow: hidden;
  }
  @media (max-width: 760px) {
    body {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main" "input";
    }
    #sidebar { display: none; }
  }
  #header {
    grid-area: header;
    background: linear-gradient(180deg, #1a1f2e, #0d1117);
    padding: 10px 16px;
    border-bottom: 2px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #header .brand { display: flex; align-items: center; gap: 10px; }
  #header .logo {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #f6d76b, #a5811f);
    border-radius: 8px;
    font-weight: bold;
    color: #2a1e04;
    font-size: 18px;
    box-shadow: 0 0 10px rgba(230,185,63,.4);
  }
  #header h1 {
    font-size: 18px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 #000;
  }
  #header .sub { font-size: 11px; color: var(--muted); }
  #status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  #status.connected { color: var(--gold); }
  #status.connected .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  #status.disconnected { color: var(--error); }
  #status.disconnected .dot { background: var(--error); }

  #main {
    grid-area: main;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 10px;
    padding: 12px;
    min-height: 0;
  }
  @media (max-width: 900px) {
    #main { grid-template-columns: 1fr; grid-auto-rows: minmax(180px, auto); overflow-y: auto; }
    #map-panel { order: 2; }
  }

  /* ---- 磁貼地圖 ---- */
  #map-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  #map-panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted);
  }
  #map {
    position: relative;
    flex: 1;
    overflow: auto;
    border-radius: 8px;
    background:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px),
      #0a0d15;
    background-size: 40px 40px, 40px 40px, auto;
  }
  .tile {
    position: absolute;
    width: 72px; height: 72px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 4px;
    font-size: 11px;
    color: #fff;
    background: #1a2030;
    border: 2px solid var(--border);
    transition: box-shadow .3s;
    line-height: 1.2;
    overflow: hidden;
  }
  .tile .emoji { font-size: 22px; display: block; margin-bottom: 2px; }
  .tile.current {
    border-color: var(--gold);
    box-shadow: 0 0 14px 3px rgba(230,185,63,.55);
    z-index: 3;
  }
  .tile.current .you {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(230,185,63,.18);
  }
  .tile.current .you span {
    font-size: 26px;
    filter: drop-shadow(0 0 4px #fff);
  }
  .tile.hub      { background: linear-gradient(160deg,#7a5a30,#3a2c17); border-color: #8a6a34; }
  .tile.forest   { background: linear-gradient(160deg,#2f6b44,#15301f); }
  .tile.cave     { background: linear-gradient(160deg,#4a4470,#241f38); }
  .tile.river    { background: linear-gradient(160deg,#2f6b9a,#16324a); }
  .tile.castle   { background: linear-gradient(160deg,#5f5a7e,#2b2840); }
  .tile.treasure { background: linear-gradient(160deg,#8a5f24,#3a2a10); border-color: #a5811f; }

  #legend { display: flex; flex-wrap: wrap; gap: 6px; }
  #legend .chip {
    font-size: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 7px;
    border-radius: 6px;
  }

  /* ---- 訊息日誌 ---- */
  #log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    overflow-y: auto;
    line-height: 1.7;
  }
  #log h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  #log .line { white-space: pre-wrap; word-break: break-word; }
  #log .line.command { color: var(--command); }
  #log .line.error { color: var(--error); }
  #log .line.system { color: var(--muted); font-style: italic; }
  #log .line.room { color: var(--room); font-weight: 600; }
  #log .line.npc { color: var(--hp); }

  /* ---- 側邊欄 ---- */
  #sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    min-height: 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .card h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .char-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #7a5f3a, #3a2f1c);
    font-size: 24px;
    margin-bottom: 8px;
    border: 2px solid var(--gold-dim);
  }
  .char-name { font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .stat-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    padding: 2px 0;
  }
  .stat-row .val { color: var(--text); font-weight: 600; }
  .hp-bar {
    height: 10px;
    background: var(--hp-bg);
    border-radius: 5px;
    overflow: hidden;
    margin: 8px 0 4px;
    border: 1px solid #4a2a2a;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff5f5f, #ff2a2a);
    transition: width .4s ease;
    box-shadow: 0 0 6px #ff2a2a inset;
  }
  .quick-cmd {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .quick-cmd button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
  }
  .quick-cmd button:hover {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 8px rgba(230,185,63,.3);
  }
  .quick-cmd button.danger { border-color: #5a3a3a; }
  .quick-cmd button.danger:hover { border-color: var(--error); color: var(--error); box-shadow: 0 0 8px rgba(255,123,114,.3); }

  /* ---- 輸入列 ---- */
  #input-area {
    grid-area: input;
    background: var(--panel-2);
    border-top: 2px solid var(--border);
    padding: 12px;
    display: flex;
    gap: 8px;
  }
  #cmd-prefix {
    color: var(--gold);
    font-weight: bold;
    padding: 0 6px;
    font-family: monospace;
  }
  #cmd-input {
    flex: 1;
    background: #0a0d15;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', monospace;
    outline: none;
  }
  #cmd-input:focus { border-color: var(--gold); box-shadow: 0 0 6px rgba(230,185,63,.3); }
</style>
</head>
<body>

<header id="header">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <h1>萬王之王 MUD</h1>
      <div class="sub">亞特蘭狄斯王國冒險</div>
    </div>
  </div>
  <div id="status">
    <div class="dot"></div>
    <span id="status-text">連線中…</span>
  </div>
</header>

<main id="main">
  <section id="map-panel">
    <h2>地圖</h2>
    <div id="map"></div>
    <div id="legend"></div>
  </section>

  <section id="log">
    <h2>冒險日誌</h2>
    <div id="log-lines"></div>
  </section>
</main>

<aside id="sidebar">
  <div class="card">
    <h3>🧝 角色狀態</h3>
    <div class="char-avatar">🧝</div>
    <div class="char-name" id="stat-name">--</div>
    <div class="hp-bar"><div class="hp-fill" id="hpfill" style="width:100%"></div></div>
    <div class="stat-row"><span>生命</span><span class="val" id="stat-hp">--</span></div>
    <div class="stat-row"><span>攻擊</span><span class="val" id="stat-atk">--</span></div>
    <div class="stat-row"><span>防禦</span><span class="val" id="stat-def">--</span></div>
    <div class="stat-row"><span>地點</span><span class="val" id="stat-room">--</span></div>
  </div>

  <div class="card">
    <h3>⚔️ 快捷指令</h3>
    <div class="quick-cmd">
      <button data-cmd="status">狀態</button>
      <button data-cmd="look">環顧</button>
      <button data-cmd="recall">召回</button>
      <button data-cmd="inventory">揹包</button>
      <button data-cmd="say 有人嗎？">喊話</button>
      <button data-cmd="help">說明</button>
      <button data-cmd="north">北</button>
      <button data-cmd="south">南</button>
      <button data-cmd="east">東</button>
      <button data-cmd="west">西</button>
      <button data-cmd="combat" class="danger">戰鬥</button>
    </div>
  </div>
</aside>

<div id="input-area">
  <span id="cmd-prefix">&gt;</span>
  <input id="cmd-input" type="text" autocomplete="off" placeholder="輸入指令，例如：help、北、combat、recall…" />
</div>

<script>
/* 房間座標（磁貼格）：hub 為中心 */
const ROOMS = {
  hub:          { x: 3, y: 3, name: '冒險者中心', emoji: '🏛️', biome: 'hub' },
  forest:       { x: 3, y: 2, name: '密語森林',   emoji: '🌲', biome: 'forest' },
  cave:         { x: 2, y: 3, name: '幽暗洞窟',   emoji: '🕳️', biome: 'cave' },
  river:        { x: 3, y: 4, name: '銀河河畔',   emoji: '🌊', biome: 'river' },
  castle_gate:  { x: 4, y: 3, name: '王城大門',   emoji: '🏰', biome: 'castle' },
  castle_hall:  { x: 5, y: 3, name: '王城大廳',   emoji: '👑', biome: 'castle' },
  treasure:     { x: 6, y: 3, name: '巨龍寶藏',   emoji: '🐉', biome: 'treasure' },
};
const ROOM_BY_NAME = {};
Object.entries(ROOMS).forEach(([key, r]) => ROOM_BY_NAME[r.name] = key);

const TILE = 72, GAP = 8;

function printLine(text, cls='') {
  const box = document.getElementById('log-lines');
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 400) box.removeChild(box.firstChild);
}

function setStatus(state, text) {
  const el = document.getElementById('status');
  el.className = state;
  document.getElementById('status-text').textContent = text;
}

function getPlayerId() {
  let id = sessionStorage.getItem('mudPlayerId');
  if (!id) { id = 'p_' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('mudPlayerId', id); }
  return id;
}
function getPlayerName() {
  let name = sessionStorage.getItem('mudPlayerName');
  if (!name) {
    const pool = ['艾利安娜','托爾夫','塞琳','布蘭德','麗塔','芬恩','格蕾絲','奧登','希雅','盧西安'];
    name = pool[Math.floor(Math.random() * pool.length)];
    sessionStorage.setItem('mudPlayerName', name);
  }
  return name;
}

document.querySelectorAll('.quick-cmd button').forEach(btn => {
  btn.addEventListener('click', () => {
    sendCommand(btn.dataset.cmd);
    input.focus();
  });
});

const input = document.getElementById('cmd-input');
function statusText(text) {
  const statusText = document.getElementById('status-text');
  statusText.textContent = text;
}
function setStat(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

/* 建立磁貼 */
const mapEl = document.getElementById('map');
function buildTiles() {
  mapEl.innerHTML = '';
  const pad = 14;
  Object.entries(ROOMS).forEach(([key, r]) => {
    const t = document.createElement('div');
    t.className = 'tile ' + r.biome;
    t.dataset.room = key;
    t.style.width = TILE + 'px';
    t.style.height = TILE + 'px';
    // 中心點定位，之後再整體平移使玩家中心
    t.style.left = (r.x * (TILE + GAP) + pad) + 'px';
    t.style.top = (r.y * (TILE + GAP) + pad) + 'px';
    t.innerHTML = `<div class="emoji">${r.emoji}</div>${r.name}`;
    mapEl.appendChild(t);
  });
}
buildTiles();

function centerOn(roomKey) {
  currentRoom = roomKey;
  const r = ROOMS[roomKey];
  if (!r) return;
  // 磁貼中心置中
  const mapW = mapEl.clientWidth;
  const mapH = mapEl.clientHeight;
  const pad = 14;
  const tileCX = r.x * (TILE + GAP) + pad + TILE / 2;
  const tileCY = r.y * (TILE + GAP) + pad + TILE / 2;
  mapEl.scrollTo({
    left: tileCX - mapW / 2,
    top: tileCY - mapH / 2,
    behavior: 'smooth'
  });
  document.querySelectorAll('.tile.current').forEach(t => {
    t.classList.remove('current');
    const you = t.querySelector('.you');
    if (you) you.remove();
  });
  const el = document.querySelector('.tile[data-room="' + roomKey + '"]');
  if (el) {
    el.classList.add('current');
    const you = document.createElement('div');
    you.className = 'you';
    you.innerHTML = '<span>🧝</span>';
    el.appendChild(you);
  }
}

function roomKeyFromName(name) {
  if (!name) return null;
  if (ROOM_BY_NAME[name]) return ROOM_BY_NAME[name];
  // 後端可能直接傳 key
  if (ROOMS[name]) return name;
  return null;
}

const playerId = getPlayerId();
const playerName = getPlayerName();
setStat('stat-name', playerName);

const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = protocol + '//' + window.location.host + '/ws?player=' + playerId + '&name=' + encodeURIComponent(playerName);

let ws = null;
let reconnectAttempts = 0;
const history = [];
let historyIndex = 0;

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    setStatus('connected', '已連線為 ' + playerName);
    reconnectAttempts = 0;
    printLine('=== 歡迎來到萬王之王 MUD ===', 'system');
    printLine('你已身在冒險者中心。輸入 "help" 開始冒險。', 'system');
    input.focus();
  };

  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { printLine(event.data, ''); return; }
    if (data.text) {
      const lines = data.text.split('\n');
      lines.forEach(line => {
        let cls = '';
        const l = line;
        // 狀態輸出
        const hpMatch = l.match(/生命：\s*(\d+)\s*\/\s*(\d+)/);
        const atkMatch = l.match(/攻擊：\s*(\d+)/);
        const defMatch = l.match(/防禦：\s*(\d+)/);
        if (hpMatch) {
          const cur = parseInt(hpMatch[1], 10), max = parseInt(hpMatch[2], 10);
          setStat('stat-hp', cur + ' / ' + max);
          document.getElementById('hpfill').style.width =
            Math.max(0, Math.min(100, max ? (cur / max) * 100 : 0)) + '%';
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (atkMatch || defMatch) {
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (l.startsWith('你身在：')) {
          const roomName = l.replace(/^你身在：\s*/, '').trim();
          setStat('stat-room', roomName);
          centerOn(roomKeyFromName(roomName) || 'hub');
          cls = 'room';
        } else if (l.startsWith('位置：')) {
          const roomName = l.replace(/^位置：\s*/, '').trim();
          setStat('stat-room', roomName);
          centerOn(roomKeyFromName(roomName) || 'hub');
          cls = 'system';
        } else if (l.startsWith('未知指令')) {
          cls = 'error';
        } else if (/(哥布林|薩滿|渡鴉|衛兵|巨龍)/.test(l) &&
                   (l.includes('造成') || l.includes('生命') || l.includes('打倒') || l.includes('反擊'))) {
          cls = 'npc';
        }
        printLine(l, cls);
      });
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', '已斷線');
    if (reconnectAttempts < 5) {
      reconnectAttempts++;
      printLine('連線中斷，重連中…（第 ' + reconnectAttempts + ' 次）', 'error');
      setTimeout(connect, 2000 * reconnectAttempts);
    }
  };
  ws.onerror = () => setStatus('disconnected', '連線錯誤');
}

function sendCommand(cmd) {
  const text = cmd.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  printLine('> ' + text, 'command');
  ws.send(text);
  history.push(text);
  historyIndex = history.length;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendCommand(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (history.length && historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (history.length && historyIndex < history.length) {
      historyIndex++;
      input.value = history[historyIndex] || '';
    }
  }
});

centerOn('hub');
connect();
</script>
</body>
</html>
