<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUD - 多人線上泥巴遊戲</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #0d1117;
    --panel-2: #161b22;
    --border: #21262d;
    --text: #c9d1d9;
    --muted: #6e7681;
    --accent: #39d353;
    --accent-dim: #238636;
    --command: #58a6ff;
    --error: #ff7b72;
    --room: #ffd866;
    --hp: #ff7b72;
    --hp-bg: #2d1b1b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cascadia Code', 'Fira Code', 'Noto Sans TC', 'Microsoft JhengHei', Consolas, monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "log sidebar"
      "input input";
    height: 100vh;
    overflow: hidden;
  }
  @media (max-width: 760px) {
    body {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "log" "input";
    }
    #sidebar { display: none; }
  }
  #header {
    grid-area: header;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #header .brand { display: flex; align-items: center; gap: 10px; }
  #header .logo {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: var(--accent-dim);
    border-radius: 7px;
    font-weight: bold;
    color: #fff;
    font-size: 16px;
  }
  #header h1 { font-size: 16px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
  #status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #888;
  }
  #status.connected { color: var(--accent); }
  #status.connected .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #status.disconnected { color: var(--error); }
  #status.disconnected .dot { background: var(--error); }

  #log {
    grid-area: log;
    overflow-y: auto;
    padding: 14px 16px;
    line-height: 1.6;
    background: var(--bg);
  }
  #log .line { white-space: pre-wrap; word-break: break-word; }
  #log .line.command { color: var(--command); }
  #log .line.error { color: var(--error); }
  #log .line.system { color: var(--accent); }
  #log .line.room { color: var(--room); font-weight: bold; }
  #log .line.npc { color: #ff9; }

  #sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .card h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .stat-row .label { color: var(--muted); }
  .stat-row .val { color: var(--text); font-weight: 600; }
  #hpbar {
    height: 8px;
    background: var(--hp-bg);
    border-radius: 4px;
    overflow: hidden;
    margin: 4px 0 8px;
  }
  #hpfill { height: 100%; width: 100%; background: var(--hp); transition: width 0.3s; }
  #map {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
      "cave hub forest"
      "castle hub river"
      "cc hall treasure";
    gap: 4px;
  }
  #map .node {
    aspect-ratio: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 2px;
  }
  #map .node.current {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 0 8px var(--accent-dim);
  }
  #map .node.legend { border-style: dashed; color: var(--muted); }

  #input-bar {
    grid-area: input;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #prompt {
    padding: 10px 14px;
    color: var(--accent);
    border-right: 1px solid var(--border);
    font-weight: bold;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 8px;
    outline: none;
  }
  #input::placeholder { color: #3d444d; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }
</style>
</head>
<body>
<div id="header">
  <div class="brand">
    <div class="logo">M</div>
    <h1>MUD 線上泥巴遊戲</h1>
  </div>
  <span id="status" class="disconnected"><span class="dot"></span><span id="status-text">連線中…</span></span>
</div>

<div id="log"></div>

<div id="sidebar">
  <div class="card">
    <h2>角色狀態</h2>
    <div class="stat-row"><span class="label">生命</span><span class="val" id="stat-hp">-</span></div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div class="stat-row"><span class="label">攻擊</span><span class="val" id="stat-atk">-</span></div>
    <div class="stat-row"><span class="label">防禦</span><span class="val" id="stat-def">-</span></div>
    <div class="stat-row"><span class="label">位置</span><span class="val" id="stat-room">冒險者中心</span></div>
  </div>
  <div class="card">
    <h2>小地圖</h2>
    <div id="map">
      <div class="node" data-room="cave" style="grid-area: cave;">洞窟</div>
      <div class="node current" data-room="hub" style="grid-area: hub;">冒險者中心</div>
      <div class="node" data-room="forest" style="grid-area: forest;">森林</div>
      <div class="node" data-room="castle_gate" style="grid-area: castle;">城門</div>
      <div class="node" data-room="river" style="grid-area: river;">河畔</div>
      <div class="node legend" style="grid-area: cc;">龍</div>
      <div class="node" data-room="castle_hall" style="grid-area: hall;">城堡大廳</div>
      <div class="node" data-room="treasure" style="grid-area: treasure;">龍的寶藏</div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5;">
      中央為冒險者中心，四向皆可出發。<br>
      <span style="border:1px dashed var(--muted);border-radius:4px;padding:0 4px;">虛線</span> = 終點（無出口）
    </div>
  </div>
  <div class="card">
    <h2>常用指令</h2>
    <div class="stat-row"><span class="label">look / 看</span><span class="val">看四周</span></div>
    <div class="stat-row"><span class="label">北 南 東 西</span><span class="val">移動</span></div>
    <div class="stat-row"><span class="label">hit / 攻擊</span><span class="val">攻擊目標</span></div>
    <div class="stat-row"><span class="label">say / 說</span><span class="val">說聲</span></div>
    <div class="stat-row"><span class="label">status / 狀態</span><span class="val">自身狀態</span></div>
    <div class="stat-row"><span class="label">recall / 召回</span><span class="val">回到中心</span></div>
  </div>
</div>

<div id="input-bar">
  <span id="prompt">&gt;</span>
  <input type="text" id="input" placeholder="輸入指令…（help 看清單）" autofocus autocomplete="off">
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');

function getPlayerId() {
  let id = localStorage.getItem('mud_player_id');
  if (!id) {
    id = 'player_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('mud_player_id', id);
  }
  return id;
}

function getPlayerName() {
  let name = localStorage.getItem('mud_player_name');
  if (!name) {
    name = prompt('輸入你的角色名字：') || '冒險者_' + getPlayerId().slice(-4);
    localStorage.setItem('mud_player_name', name);
  }
  return name;
}

function printLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setStatus(cls, text) {
  statusEl.className = cls;
  statusText.textContent = text;
}

function setStat(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

// 房間名稱 -> 小地圖 key
const roomToKey = {
  '冒險者中心': 'hub',
  '黑暗森林': 'forest',
  '哥布林洞窟': 'cave',
  '河畔': 'river',
  '城堡大門': 'castle_gate',
  '城堡大廳': 'castle_hall',
  '龍的寶藏': 'treasure',
};

function highlightRoom(roomName) {
  const key = roomToKey[roomName] || (roomName || '').toLowerCase();
  document.querySelectorAll('#map .node.current').forEach(n => n.classList.remove('current'));
  const el = document.querySelector('#map .node[data-room="' + key + '"]');
  if (el) el.classList.add('current');
}

const playerId = getPlayerId();
const playerName = getPlayerName();

const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = protocol + '//' + window.location.host + '/ws?player=' + playerId + '&name=' + encodeURIComponent(playerName);

let ws = null;
let reconnectAttempts = 0;
const history = [];
let historyIndex = 0;

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    setStatus('connected', '已連線為 ' + playerName);
    reconnectAttempts = 0;
    printLine('=== 已連線 ===', 'system');
    printLine('你已經進入遊戲。輸入 "help" 開始冒險。', 'system');
    input.focus();
  };

  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { printLine(event.data, ''); return; }
    if (data.text) {
      const lines = data.text.split('\n');
      lines.forEach(line => {
        let cls = '';
        const l = line;
        // 狀態輸出：生命：cur/max、攻擊：A、防禦：D
        const hpMatch = l.match(/生命：\s*(\d+)\s*\/\s*(\d+)/);
        const atkMatch = l.match(/攻擊：\s*(\d+)/);
        const defMatch = l.match(/防禦：\s*(\d+)/);
        if (hpMatch) {
          const cur = parseInt(hpMatch[1], 10), max = parseInt(hpMatch[2], 10);
          setStat('stat-hp', cur + ' / ' + max);
          document.getElementById('hpfill').style.width = Math.max(0, Math.min(100, max ? (cur / max) * 100 : 0)) + '%';
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (atkMatch || defMatch) {
          if (atkMatch) setStat('stat-atk', atkMatch[1]);
          if (defMatch) setStat('stat-def', defMatch[1]);
          cls = 'system';
        } else if (l.startsWith('你身在：')) {
          const room = l.replace(/^你身在：\s*/, '').trim();
          setStat('stat-room', room);
          highlightRoom(room);
          cls = 'room';
        } else if (l.startsWith('位置：')) {
          const room = l.replace(/^位置：\s*/, '').trim();
          setStat('stat-room', room);
          highlightRoom(room);
          cls = 'system';
        } else if (l.startsWith('未知指令')) {
          cls = 'error';
        } else if (/(哥布林|薩滿|渡鴉|衛兵|巨龍)/.test(l) && (l.includes('受到') || l.includes('生命') || l.includes('打倒'))) {
          cls = 'npc';
        }
        printLine(line, cls);
      });
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', '已斷線');
    if (reconnectAttempts < 5) {
      reconnectAttempts++;
      printLine('連線中斷，重連中…（第 ' + reconnectAttempts + ' 次）', 'error');
      setTimeout(connect, 2000 * reconnectAttempts);
    }
  };

  ws.onerror = () => {
    setStatus('disconnected', '連線錯誤');
  };
}

function sendCommand(cmd) {
  const text = cmd.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  printLine('&gt; ' + text, 'command');
  ws.send(text);
  history.push(text);
  historyIndex = history.length;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendCommand(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (history.length && historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (history.length && historyIndex < history.length) {
      historyIndex++;
      input.value = history[historyIndex] || '';
    }
  }
});

// 初始位置：冒險者中心
highlightRoom('冒險者中心');
connect();
</script>
</body>
</html>
